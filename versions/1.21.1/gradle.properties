# Build target: Minecraft 1.21.1 on NeoForge, against TerraFirmaCraft 4.x
minecraftVersion=1.21.1
neoForgeVersion=21.1.234
javaVersion=21

parchmentVersion=2024.11.17
parchmentMinecraftVersion=1.21.1

# TerraFirmaCraft, resolved from the Modrinth maven (maven.modrinth:terrafirmacraft:<version>)
tfcVersion=4.2.7
tfcVersionRange=[4.2.0,5.0.0)

# Patchouli is a hard dependency of TFC, needed on the dev runtime classpath
patchouliVersion=1.21.1-92-NEOFORGE

# Jade, in the dev run only - it reads a pile's count straight off the block state, and it is the
# tooltip mod most likely to disagree with a block that draws its own contents.
#
# This is a Modrinth version number, not a file name: pick the 1.21.1 NeoForge build from
# https://modrinth.com/mod/jade/versions?l=neoforge&g=1.21.1 and use its version number verbatim.
# Blank the property to leave Jade out, or drop the jar in versions/1.21.1/libs instead.
jadeVersion=15.9.2+neoforge
